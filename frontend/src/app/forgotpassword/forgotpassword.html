<div class="auth-container">
  <h2>Forgot Password</h2>

  <form (ngSubmit)="onSubmit()">
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Enter your email"
      required
    />
    <button type="submit">Continue</button>
  </form>

  @if (error) {
    <p class="error-text" style="color: red;">{{ error }}</p>
  }
</div>
